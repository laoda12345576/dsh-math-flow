- insert:
    - id: claim-verify
      name: 'dsh-plugin-claim-verify'
      config:
        # Python interpreter. Empty = resolve `python` from PATH.
        pythonExe: ''
        # 单条判定的硬上限。机械判定应当是秒级，超过这个数说明它不是机械判定。
        timeoutMs: 120000
        # 判定产物的落盘目录，相对于工作目录。
        stateDir: '.claim-verify'
